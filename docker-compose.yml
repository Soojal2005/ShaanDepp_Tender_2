version: '3.9'
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shandeep_tenders
    ports:
      - "5432:5432"
    volumes:
      - ./backend/migrations/001_initial_53_tables.sql:/docker-entrypoint-initdb.d/001_init.sql

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@db:5432/shandeep_tenders
      GRAPH_MAILBOX_USER: alerts@procure-brain.com
      GRAPH_RATE_LIMIT_PER_MIN: 25
    depends_on:
      - db
